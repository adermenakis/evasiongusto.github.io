version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evasiongusto-web
    ports:
      - "8080:80"
    environment:
      - TZ=Europe/Brussels
    restart: unless-stopped
    labels:
      - "description=Évasion Gusto Website Development Server"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
